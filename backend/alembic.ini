[alembic]
script_location = alembic
prepend_sys_path = .

# sqlalchemy.url is deliberately NOT set here - env.py reads it from
# app.config.settings (which reads DATABASE_URL from .env), so there is
# still exactly one place database credentials live, per the project's
# "secrets never hard-coded, one source of truth" config principle.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S